name: Verify released Beta 2 updater
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  updater:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare verified probe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((Get-FileHash AccommodationTestManager-Beta2-Update2.zip).Hash -ne '9a815aef2eef5739007b95ff5554044d8cf7ea92c16b25a65d4679817466c910') { throw 'Source checksum mismatch' }
          Expand-Archive AccommodationTestManager-Beta2-Update2.zip work/source
          $root=(Resolve-Path work/source/AccommodationTestManager-Beta2-Update2).Path
          "ATM_SOURCE=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Released Update 1 updater integration check
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://github.com/EmmanuelA0428/AccommodationTestManager/releases/download/v1.0.0-beta.2.2/AccommodationTestManager-Beta2-Update1.zip' -OutFile work/previous.zip
          if ((Get-FileHash work/previous.zip).Hash -ne '54a33cd1730853ab2178aaf8c92177056bfe03f72d5e2ed933208478187431ff') { throw 'Previous source hash mismatch' }
          Expand-Archive work/previous.zip work/previous
          $previous=(Resolve-Path work/previous/AccommodationTestManager-Beta2-Update1).Path
          Copy-Item "$env:ATM_SOURCE/DeveloperTests/CheckPreviousUpdater.cs.txt" "$previous/DeveloperTests/Program.cs" -Force
          dotnet run --project "$previous/DeveloperTests/BetaTests.csproj" -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Released updater integration check failed' }
